<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SnipChat</title>
<style>
:root{
  --bg:#f5f7fb;--card:#fff;--line:#e3e9f4;--tx:#1c2438;--tx2:#5a6b8c;--tx3:#93a1bd;
  --blue:#2563eb;--violet:#7c3aed;--grad:linear-gradient(135deg,#2563eb,#7c3aed);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:14px/1.6 system-ui,-apple-system,'PingFang SC',sans-serif;
  height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{flex:none;padding:14px 18px 12px;border-bottom:1px solid var(--line);background:#fff;display:flex;align-items:center;gap:10px}
header .logo{width:30px;height:30px;border-radius:9px;background:var(--grad);display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px}
header h1{font-size:15.5px;flex:1}
header h1 small{display:block;font-weight:500;color:var(--tx3);font-size:11px}
header .kb{font:600 10.5px/1 var(--mono),monospace;color:var(--tx2);border:1px solid var(--line);border-radius:7px;padding:5px 8px}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:86%;padding:10px 13px;border-radius:13px;font-size:13.5px;white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:var(--grad);color:#fff;border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px;color:var(--tx)}
.msg.bot.running{color:var(--tx2)}
.msg.sys{align-self:center;background:none;color:var(--tx3);font-size:11.5px;font-family:var(--mono),monospace}
.msg .imgs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:7px}
.msg .imgs img{width:74px;height:74px;object-fit:cover;border-radius:8px;border:1px solid rgba(255,255,255,.5)}
.msg.bot .imgs img{border-color:var(--line)}
.empty{margin:auto;text-align:center;color:var(--tx3);font-size:13px;padding:30px}
.empty .big{font-size:34px;margin-bottom:10px}
#composer{flex:none;border-top:1px solid var(--line);background:#fff;padding:12px}
#attach{display:none;flex-wrap:wrap;gap:8px;margin-bottom:9px}
#attach.show{display:flex}
.att{position:relative}
.att img{width:56px;height:56px;object-fit:cover;border-radius:9px;border:1.5px solid var(--line)}
.att button{position:absolute;top:-7px;right:-7px;width:19px;height:19px;border-radius:50%;border:none;
  background:#ef4444;color:#fff;font-size:11px;cursor:pointer;line-height:1}
.row{display:flex;gap:8px}
#prompt{flex:1;resize:none;border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;font:13.5px/1.5 inherit;
  color:var(--tx);outline:none;max-height:110px;background:#fbfcfe}
#prompt:focus{border-color:var(--blue);background:#fff}
#send{flex:none;width:46px;border:none;border-radius:11px;background:var(--grad);color:#fff;font-size:17px;cursor:pointer}
#send:disabled{opacity:.5;cursor:wait}
.tools{display:flex;gap:8px;margin-top:9px;align-items:center}
.tools button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 10px;font-size:12px;color:var(--tx2);cursor:pointer}
.tools button:hover{border-color:#a9bce2;color:var(--tx)}
.tools .sp{flex:1}
.tools .mode{font:600 10.5px/1 var(--mono),monospace;color:var(--tx3)}
</style>
</head>
<body>
<header>
  <div class="logo">S</div>
  <h1>SnipChat<small>截屏 · 标注 · 问 codex</small></h1>
  <span class="kb">Ctrl+Alt+A 截屏</span>
</header>
<div id="chat">
  <div class="empty"><div class="big">📷</div>按 Ctrl+Alt+A 截屏<br>截完点「问问 codex」，图和问题一起发
  </div>
</div>
<div id="composer">
  <div id="attach"></div>
  <div class="row">
    <textarea id="prompt" rows="1" placeholder="问点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
    <button id="send" title="发送">➤</button>
  </div>
  <div class="tools">
    <button id="newThread">＋ 新话题</button>
    <button id="clearImg">清空图片</button>
    <span class="sp"></span>
    <span class="mode" id="mode">将开始新话题</span>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
