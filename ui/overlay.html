<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box;cursor:crosshair;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:transparent}
#cap{position:absolute;left:-99999px;top:0}  /* 离屏原图 */
#dim{position:absolute;inset:0;background:rgba(10,14,23,.35)}
#rect{position:absolute;border:1.5px solid #5aa2ff;box-shadow:0 0 0 9999px rgba(10,14,23,.35);display:none;pointer-events:none}
#mag{position:absolute;width:150px;height:150px;border:2px solid #5aa2ff;border-radius:10px;display:none;pointer-events:none;
  overflow:hidden;background:#000;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#mag canvas{width:100%;height:100%}
#hint{position:absolute;left:50%;top:26px;transform:translateX(-50%);background:rgba(15,22,38,.86);color:#dbe7ff;
  font:600 12.5px/1 system-ui,sans-serif;padding:11px 17px;border-radius:11px;pointer-events:none}
#size{position:absolute;color:#fff;background:rgba(37,99,235,.92);font:700 11px/1 var(--mono),monospace;
  padding:4px 8px;border-radius:6px;display:none;pointer-events:none}
</style>
</head>
<body>
<img id="cap">
<div id="dim"></div>
<div id="rect"></div>
<div id="mag"><canvas id="magc" width="150" height="150"></canvas></div>
<div id="hint">拖拽框选 · Enter 确认 · Esc 取消</div>
<div id="size"></div>
<script src="overlay.js"></script>
</body>
</html>
